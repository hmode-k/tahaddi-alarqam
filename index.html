<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي الأرقام</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap');

:root{
  --bg:#0f172a;
  --bg2:#1e1b4b;
  --card:#1e293b;
  --line:#334155;
  --ink:#f8fafc;
  --ink-dim:#94a3b8;
  --easy:#10b981;
  --med:#f59e0b;
  --hard:#ef4444;
  --gold:#fbbf24;
  --purple:#8b5cf6;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 90% -10%, rgba(139,92,246,.15), transparent 40%),
                    radial-gradient(circle at 0% 100%, rgba(16,185,129,.15), transparent 40%);
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
}
.wrap{max-width:460px; margin:0 auto; padding:26px 18px 40px; min-height:100vh; position:relative;}
.screen{display:none;}
.screen.active{display:block;}

/* HOME */
.top-actions{display:flex; gap:8px; margin-bottom:16px;}
.icon-btn{
  flex:1; background:var(--card); border:1px solid var(--line); color:var(--ink-dim);
  padding:9px 8px; border-radius:12px; font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700;
  cursor:pointer;
}
.brand{text-align:center; margin-bottom:8px;}
.brand h1{
  font-size:32px;
  font-weight:900;
  margin:0 0 4px;
  background:linear-gradient(90deg,var(--easy),var(--gold),var(--purple));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.brand p{margin:0; font-size:13.5px; color:var(--ink-dim);}

.best-row{
  display:flex;
  justify-content:center;
  gap:22px;
  margin:18px 0 26px;
}
.best-item{text-align:center;}
.best-item .n{font-size:20px; font-weight:800; color:var(--gold);}
.best-item .l{font-size:11px; color:var(--ink-dim); margin-top:2px;}

.diff-card{
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(135deg,#1e1b4b,var(--card));
}
.diff-card:active{transform:scale(.98);}
.diff-name{font-size:17px; font-weight:800; margin:0 0 3px; color:var(--purple);}
.diff-desc{font-size:12px; color:var(--ink-dim); margin:0;}
.diff-badge{
  font-size:22px; width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:900;
  background:rgba(139,92,246,0.2); color:var(--purple);
}

/* GAME */
.game-top{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;
}
.exit-btn{
  background:var(--card); border:1px solid var(--line); color:var(--ink-dim);
  width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer;
}
.score-pill{
  background:var(--card); border:1px solid var(--line);
  padding:7px 14px; border-radius:20px; font-size:13.5px; font-weight:700;
  display:flex; align-items:center; gap:6px;
}
.score-pill .gold{color:var(--gold);}

.timer-track{
  height:8px; background:var(--card); border-radius:4px; overflow:hidden; margin-bottom:16px;
}
.timer-fill{height:100%; border-radius:4px; background:var(--gold); transition:width 0.1s linear;}

.q-card{
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:30px 20px; text-align:center; margin-bottom:16px;
}
.q-label{font-size:12px; color:var(--ink-dim); margin-bottom:10px;}
.q-expr{font-size:38px; font-weight:800; letter-spacing:1px;}

.answers{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:16px;}
.opt-btn{
  padding:18px; border-radius:14px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:'Cairo',sans-serif;
  font-size:20px; font-weight:800; cursor:pointer;
}
.opt-btn:active{opacity:.8; transform:scale(0.98);}

.help-btn{
  width:100%; padding:12px; border-radius:12px; border:1px solid var(--purple);
  background:rgba(139,92,246,0.15); color:var(--purple); font-family:'Cairo',sans-serif;
  font-weight:700; font-size:14px; cursor:pointer; text-align:center;
}

/* RESULT */
.result-card{text-align:center; padding:40px 20px;}
.result-emoji{font-size:52px; margin-bottom:14px;}
.result-title{font-size:22px; font-weight:800; margin-bottom:6px;}
.result-stats{display:flex; justify-content:center; gap:26px; margin:20px 0 30px;}
.result-stats .n{font-size:24px; font-weight:800; color:var(--gold);}
.result-stats .l{font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
.result-actions{display:flex; flex-direction:column; gap:10px;}
.btn-primary{
  padding:15px; border-radius:14px; border:none;
  background:var(--gold); color:#0f172a; font-weight:800; font-size:15px;
  font-family:'Cairo',sans-serif; cursor:pointer;
}
.btn-secondary{
  padding:15px; border-radius:14px; border:1px solid var(--line);
  background:transparent; color:var(--ink); font-weight:700; font-size:14.5px;
  font-family:'Cairo',sans-serif; cursor:pointer;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="brand">
      <h1>تحدي الأرقام</h1>
      <p>اختبر سرعة تفكيرك وحساباتك</p>
    </div>
    <div class="best-row">
      <div class="best-item"><div class="n" id="bestScore">0</div><div class="l">أعلى نتيجة</div></div>
    </div>

    <div class="diff-card" onclick="startGame()">
      <div>
        <p class="diff-name">ابدأ التحدي 🔥</p>
        <p class="diff-desc">١٥ ثانية لكل سؤال + زر تجميد الوقت</p>
      </div>
      <div class="diff-badge">▶</div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="game-top">
      <button class="exit-btn" onclick="goHome()">✕</button>
      <div class="score-pill"><span class="gold" id="scoreVal">0</span> نقطة</div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

    <div class="q-card">
      <div class="q-label" id="qLabel">سؤال ١</div>
      <div class="q-expr" id="qExpr">?</div>
    </div>

    <div class="answers" id="answersArea"></div>

    <button class="help-btn" id="helpBtn" onclick="useFreezeHelp()">⏱️ تجميد الوقت (+5 ثواني)</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-emoji">🏆</div>
      <div class="result-title">انتهت الجولة!</div>
      <div class="result-stats">
        <div><div class="n" id="resScore">0</div><div class="l">مجموع النقاط</div></div>
      </div>
      <div class="result-actions">
        <button class="btn-primary" onclick="startGame()">لعبة جديدة</button>
        <button class="btn-secondary" onclick="goHome()">الرئيسية</button>
      </div>
    </div>
  </div>

</div>

<script>
// الأوقات المحددة والتجهيز للصوت
const TIME_LIMIT = 15;
let score = 0;
let currentRound = 0;
let timer = null;
let timeLeft = 0;
let correctAnswer = 0;
let bestScore = 0;
let helpUsed = false;

// نظام المؤثرات الصوتية المدمج
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'wrong') {
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'freeze') {
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){
  clearInterval(timer);
  document.getElementById('bestScore').textContent = bestScore;
  showScreen('screen-home');
}

function startGame(){
  score = 0;
  currentRound = 0;
  helpUsed = false;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('helpBtn').style.display = 'block';
  showScreen('screen-game');
  nextQuestion();
}

function nextQuestion(){
  currentRound++;
  document.getElementById('qLabel').textContent = `السؤال ${currentRound}`;
  
  let num1 = Math.floor(Math.random() * 20) + 1;
  let num2 = Math.floor(Math.random() * 20) + 1;
  correctAnswer = num1 + num2;

  document.getElementById('qExpr').textContent = `${num1} + ${num2}`;

  let answers = [correctAnswer];
  while(answers.length < 4){
    let wrong = correctAnswer + Math.floor(Math.random() * 9) - 4;
    if(wrong !== correctAnswer && wrong > 0 && !answers.includes(wrong)){
      answers.push(wrong);
    }
  }
  answers.sort(() => Math.random() - 0.5);

  const answersArea = document.getElementById('answersArea');
  answersArea.innerHTML = '';
  answers.forEach(ans => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = ans;
    btn.onclick = () => checkAnswer(ans);
    answersArea.appendChild(btn);
  });

  startTimer();
}

function startTimer(){
  clearInterval(timer);
  timeLeft = TIME_LIMIT;
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';

  timer = setInterval(() => {
    timeLeft -= 0.1;
    fill.style.width = `${(timeLeft / TIME_LIMIT) * 100}%`;
    if(timeLeft <= 0){
      clearInterval(timer);
      playSound('wrong');
      endGame();
    }
  }, 100);
}

function useFreezeHelp(){
  if(!helpUsed){
    helpUsed = true;
    timeLeft += 5;
    playSound('freeze');
    document.getElementById('helpBtn').style.display = 'none';
  }
}

function checkAnswer(selected){
  clearInterval(timer);
  if(selected === correctAnswer){
    playSound('correct');
    score += 10;
    document.getElementById('scoreVal').textContent = score;
    nextQuestion();
  } else {
    playSound('wrong');
    endGame();
  }
}

function endGame(){
  if(score > bestScore) bestScore = score;
  document.getElementById('resScore').textContent = score;
  showScreen('screen-result');
}
</script>
</body>
</html>
