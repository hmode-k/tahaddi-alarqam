<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الأرقام المطور</title>
    <style>
        :root {
            --bg: #11152A;
            --card: #1C2246;
            --text: #F1F5F9;
            --easy: #3FCB82;
            --med: #F5A62C;
            --hard: #F45F60;
            --gold: #FFD166;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .score-box, .high-score-box {
            font-size: 14px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .timer-bar {
            width: 100%;
            height: 8px;
            background: #2A315C;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: var(--easy);
            transition: width 0.1s linear;
        }

        .question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background: #2A315C;
            color: var(--text);
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: var(--easy);
            width: 100%;
            margin-top: 15px;
        }

        .streak-badge {
            color: var(--gold);
            font-size: 14px;
            margin-top: 5px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="score-box">النقاط: <span id="score">0</span></div>
        <div class="high-score-box">أعلى نتيجة: <span id="highScore">0</span></div>
    </div>

    <div id="startScreen">
        <h1>تحدي الأرقام 🧠</h1>
        <p>اختبر سرعتك في حل العمليات الحسابية!</p>
        <button class="btn btn-start" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="streak-badge" id="streakBox">سلسلة الإجابات: 0 🔥</div>
        <div class="timer-bar">
            <div class="timer-fill" id="timerFill"></div>
        </div>
        <div class="question" id="questionBox">0 + 0</div>
        <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div id="endScreen" class="hidden">
        <h2>انتهى الوقت! ⏱️</h2>
        <p>مجموع نقاطك: <span id="finalScore">0</span></p>
        <button class="btn btn-start" onclick="startGame()">إعادة المحاولة</button>
    </div>
</div>

<script>
    let score = 0;
    let highScore = localStorage.getItem('numChallenge_highScore') || 0;
    let streak = 0;
    let currentAnswer = 0;
    let timerInterval;
    let timeLeft = 100;

    document.getElementById('highScore').innerText = highScore;

    function startGame() {
        score = 0;
        streak = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('streakBox').innerText = `سلسلة الإجابات: ${streak} 🔥`;
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('endScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');

        nextQuestion();
    }

    function generateQuestion() {
        const ops = ['+', '-', '*'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        let num1, num2;

        if (op === '+') {
            num1 = Math.floor(Math.random() * 50) + 1;
            num2 = Math.floor(Math.random() * 50) + 1;
            currentAnswer = num1 + num2;
        } else if (op === '-') {
            num1 = Math.floor(Math.random() * 50) + 10;
            num2 = Math.floor(Math.random() * num1);
            currentAnswer = num1 - num2;
        } else if (op === '*') {
            num1 = Math.floor(Math.random() * 12) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            currentAnswer = num1 * num2;
        }

        document.getElementById('questionBox').innerText = `${num1} ${op} ${num2}`;
    }

    function nextQuestion() {
        generateQuestion();
        renderOptions();
        resetTimer();
    }

    function renderOptions() {
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        
        let options = [currentAnswer];
        while (options.length < 4) {
            let wrong = currentAnswer + (Math.floor(Math.random() * 10) - 5);
            if (wrong !== currentAnswer && wrong >= 0 && !options.includes(wrong)) {
                options.push(wrong);
            }
        }

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === currentAnswer) {
            streak++;
            score += 10 + (streak > 3 ? 5 : 0); // مكافأة السلسلة
            document.getElementById('score').innerText = score;
            document.getElementById('streakBox').innerText = `سلسلة الإجابات: ${streak} 🔥`;
            nextQuestion();
        } else {
            endGame();
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 100;
        const fill = document.getElementById('timerFill');
        
        timerInterval = setInterval(() => {
            timeLeft -= 2;
            fill.style.width = `${timeLeft}%`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 100);
    }

    function endGame() {
        clearInterval(timerInterval);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('numChallenge_highScore', highScore);
            document.getElementById('highScore').innerText = highScore;
        }

        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('endScreen').classList.remove('hidden');
    }
</script>

</body>
</html>
